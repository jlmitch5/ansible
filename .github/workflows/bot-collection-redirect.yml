name: Collection redirect

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  redirect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/ansibot
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const yaml = require('js-yaml');
            const { owner, repo } = context.repo;
            const issue = context.payload.issue;

            const config = yaml.load(
              fs.readFileSync('.github/ansibot/collection-redirects.yml', 'utf8')
            );
            const redirects = config.redirects || {};

            const body = issue.body || '';
            const componentMatch = body.match(
              /### Component Name\s*\n+\s*(.+)/i
            );
            if (!componentMatch) return;

            const components = componentMatch[1]
              .split(/[,\s]+/)
              .map(c => c.trim().toLowerCase())
              .filter(Boolean);

            for (const component of components) {
              // Check exact match first, then prefix match
              let redirect = redirects[component];
              if (!redirect) {
                for (const [key, value] of Object.entries(redirects)) {
                  if (component.startsWith(key)) {
                    redirect = value;
                    break;
                  }
                }
              }

              if (redirect) {
                const marker = '<!-- ansibot-collection-redirect -->';
                const comment = [
                  marker,
                  `### Component moved to a collection`,
                  '',
                  `The component referenced in this issue (\`${component}\`) has been moved to the`,
                  `**${redirect.collection}** collection.`,
                  '',
                  `Please open a new issue in the correct repository:`,
                  `:point_right: **${redirect.repo}**`,
                  '',
                  'For more information about Ansible collections and the migration from `ansible/ansible`,',
                  'see the [Ansible Collections Overview](https://github.com/ansible-collections/overview).',
                  '',
                  '*This is an automated message from the ansible triage bot.*',
                ].join('\n');

                await github.rest.issues.createComment({
                  owner, repo,
                  issue_number: issue.number,
                  body: comment,
                });

                await github.rest.issues.addLabels({
                  owner, repo,
                  issue_number: issue.number,
                  labels: ['collection_redirect'],
                });

                await github.rest.issues.update({
                  owner, repo,
                  issue_number: issue.number,
                  state: 'closed',
                  state_reason: 'not_planned',
                });

                core.info(`Redirected issue #${issue.number} to ${redirect.collection}`);
                return;
              }
            }

            core.info('No collection redirect needed.');
